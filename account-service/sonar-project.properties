# Unique key in SonarQube instance
sonar.projectKey=my:pg-account-service:v2

# Display name and version
sonar.projectName=PGAccountService-V2
sonar.projectVersion=2.0

# Paths to source code and test code
sonar.sources=src/main/java
# sonar.tests=src/test/java

# Maven usually outputs compiled classes to target/classes
sonar.java.binaries=target/classes

# Optional: ignore generated or config files
sonar.exclusions=**/config/**, **/generated/**

# Optional: test coverage using JaCoCo
# Use this only if you're generating .exec with the Maven JaCoCo plugin
sonar.jacoco.reportPaths=target/jacoco.exec

# If using the new XML format, uncomment the following instead:
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Source encoding
sonar.sourceEncoding=UTF-8
