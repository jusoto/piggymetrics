static_resources:
  listeners:
    - name: listener_1
      address:
        socket_address: { address: 0.0.0.0, port_value: 8082 } # Envoy receives traffic on 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: auth_route
                  virtual_hosts:
                    - name: auth
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: auth_cluster }
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: auth_cluster
      connect_timeout: 0.25s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: auth_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth-service, port_value: 8082 } # Internal app port

admin:
  access_log_path: /tmp/envoy_admin.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 9902 } # Admin interface
