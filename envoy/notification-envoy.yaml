static_resources:
  listeners:
    - name: listener_3
      address:
        socket_address: { address: 0.0.0.0, port_value: 8084 } # Envoy receives traffic on 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: notifications_route
                  virtual_hosts:
                    - name: notifications
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: notifications_cluster }
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: notifications_cluster
      connect_timeout: 0.25s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: notifications_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {
                        address: notifications-service,
                        port_value: 8084,
                      } # Internal app port

admin:
  access_log_path: /tmp/envoy_admin.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 9904 } # Admin interface
