# for envoy 1.19+ using v3 API
# Sidecar: listens on 5000 (public port) and forwards to the app on 127.0.0.1:5001.
# Every request/response pair is tapped to /var/log/envoy/piggymetrics-auth_<id>.json
admin:
  access_log_path: /tmp/admin_access_envoy_auth.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

node:
  id: "envoy-auth-instance"
  cluster: auth_cluster
  metadata:
    role: auth-service

static_resources:
  clusters:
    - name: auth_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5001
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 5000
      filter_chains:
        - filters:
            - name: envoy.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: auth-service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: auth_cluster
                http_filters:
                  - name: envoy.filters.http.tap
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.tap.v3.Tap
                      common_config:
                        static_config:
                          match_config:
                            any_match: true
                          output_config:
                            streaming: true
                            sinks:
                              - format: JSON_BODY_AS_STRING
                                file_per_tap:
                                  path_prefix: "/var/log/envoy/piggymetrics-auth"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
